  /api/degree/degreeplans/{degreeplan_pk}/fulfillments/{full_code}/override:
    post:
      operationId: Add Override Fulfillment
      description: '(POST `/api/degree/degreeplans/{degreeplan_pk}/fulfillments/{full_code}/override`)


        Add a manual override that allows a course to count for a rule regardless of whether

        it satisfies the rule''s Q filter. Also adds the rule to the fulfillment''s selected

        rules if not already present.


        POST with `{"rule_id": }`.'
