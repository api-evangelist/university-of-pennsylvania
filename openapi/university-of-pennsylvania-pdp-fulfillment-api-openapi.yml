openapi: 3.2.0
info:
  title: Penn Courses API Documentation [PDP] Fulfillment API
  version: ''
  description: '# Introduction

    Penn Courses (GitHub) is the umbrella

    categorization for Penn Labs

    products designed to help students navigate the course registration process.'
  x-logo:
    url: https://i.imgur.com/tVsRNxJ.png
    altText: Labs Logo
  contact:
    email: contact@pennlabs.org
servers:
- url: https://penncoursereview.com
  description: Penn Course Review
- url: https://penncourseplan.com
  description: Penn Course Plan
tags:
- name: '[PDP] Fulfillment'
  description: ''
paths:
  /api/degree/degreeplans/{degreeplan_pk}/fulfillments:
    get:
      operationId: List Fulfillments
      description: '(GET `/api/degree/degreeplans/{degreeplan_pk}/fulfillments`)


        List, retrieve, create, destroy, and update a Fulfillment.'
      parameters:
      - name: degreeplan_pk
        in: path
        required: true
        description: ''
        schema:
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      readOnly: true
                    degree_plan:
                      type: integer
                      description: The degree plan with which this fulfillment is associated
                    full_code:
                      type: string
                      description: The dash-joined department and code of the course, e.g., `CIS-120`
                      maxLength: 16
                    course:
                      type: string
                      readOnly: true
                    semester:
                      type:
                      - string
                      - 'null'
                      description: '

                        The semester of the course (of the form YYYYx where x is A [for spring],

                        B [summer], or C [fall]), e.g. `2019C` for fall 2019. Null if this fulfillment

                        does not yet have a semester.

                        '
                      maxLength: 5
                    rules:
                      type: array
                      items:
                        type: integer
                    unselected_rules:
                      type: array
                      items:
                        type: integer
                      description: '

                        The rules this course fulfills that should be shown in the open-ended rule box

                        (as opposed to the expandable box). Blank if this course should not be included in

                        any open-ended rule boxes.

                        '
                    legal:
                      type: boolean
                      description: '

                        True if course associated with this fulfillment isn''t illegally double counted anywhere,

                        false otherwise.

                        '
                    overrides:
                      type: array
                      items:
                        type: string
                      readOnly: true
          description: ''
      tags:
      - '[PDP] Fulfillment'
      summary: List fulfillments
      x-summary-source: derived
    post:
      operationId: Create Fulfillment
      description: '(POST `/api/degree/degreeplans/{degreeplan_pk}/fulfillments`)


        Create or update fulfillment.'
      parameters:
      - name: degreeplan_pk
        in: path
        required: true
        description: ''
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                id:
                  type: integer
                  readOnly: true
                degree_plan:
                  type: integer
                  description: The degree plan with which this fulfillment is associated
                full_code:
                  type: string
                  description: The dash-joined department and code of the course, e.g., `CIS-120`
                  maxLength: 16
                course:
                  type: string
                  readOnly: true
                semester:
                  type:
                  - string
                  - 'null'
                  description: '

                    The semester of the course (of the form YYYYx where x is A [for spring],

                    B [summer], or C [fall]), e.g. `2019C` for fall 2019. Null if this fulfillment

                    does not yet have a semester.

                    '
                  maxLength: 5
                rules:
                  type: array
                  items:
                    type: integer
                unselected_rules:
                  type: array
                  items:
                    type: integer
                  description: '

                    The rules this course fulfills that should be shown in the open-ended rule box

                    (as opposed to the expandable box). Blank if this course should not be included in

                    any open-ended rule boxes.

                    '
                legal:
                  type: boolean
                  description: '

                    True if course associated with this fulfillment isn''t illegally double counted anywhere,

                    false otherwise.

                    '
                overrides:
                  type: array
                  items:
                    type: string
                  readOnly: true
              required:
              - degree_plan
              - full_code
      responses:
        '201':
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    readOnly: true
                  degree_plan:
                    type: integer
                    description: The degree plan with which this fulfillment is associated
                  full_code:
                    type: string
                    description: The dash-joined department and code of the course, e.g., `CIS-120`
                    maxLength: 16
                  course:
                    type: string
                    readOnly: true
                  semester:
                    type:
                    - string
                    - 'null'
                    description: '

                      The semester of the course (of the form YYYYx where x is A [for spring],

                      B [summer], or C [fall]), e.g. `2019C` for fall 2019. Null if this fulfillment

                      does not yet have a semester.

                      '
                    maxLength: 5
                  rules:
                    type: array
                    items:
                      type: integer
                  unselected_rules:
                    type: array
                    items:
                      type: integer
                    description: '

                      The rules this course fulfills that should be shown in the open-ended rule box

                      (as opposed to the expandable box). Blank if this course should not be included in

                      any open-ended rule boxes.

                      '
                  legal:
                    type: boolean
                    description: '

                      True if course associated with this fulfillment isn''t illegally double counted anywhere,

                      false otherwise.

                      '
                  overrides:
                    type: array
                    items:
                      type: string
                    readOnly: true
          description: ''
      tags:
      - '[PDP] Fulfillment'
      summary: Create fulfillment
      x-summary-source: derived
