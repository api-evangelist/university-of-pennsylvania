apis:
- aid: university-of-pennsylvania:penn-courses
  name: Penn Courses API (Penn Course Alert / Plan / Review / Degree Plan)
  description: >-
    One API, four student-facing products: Penn Course Alert (PCA), Penn Course Plan (PCP), Penn Course
    Review (PCR) and Penn Degree Plan (PDP), plus a shared Accounts resource. The live OpenAPI 3.0.2 document
    at penncourseplan.com/api/openapi/ declares 45 paths across 29 tags and returned HTTP 200 (415 KB)
    on 2026-08-19; public course search reads anonymously while review and user-scoped resources return
    403. Operated by PENN LABS, a non-profit student-run software organization at Penn, on domains registered
    to Penn Labs — not by the university. The 29 OpenAPI documents held here are the per-tag split of
    that single contract; they are one surface, not twenty-nine. The previous profile listed them as twenty-nine
    separate University of Pennsylvania APIs.
  x-operator: tenant
  x-operator-entity: >-
    Penn Labs (non-profit student-run software organization at the University of Pennsylvania)
  x-operator-evidence: >-
    penncourseplan.com WHOIS registrant organization is "Penn Labs"; info.description of the live OpenAPI
    describes the API as a Penn Labs product.
  humanURL: https://penncourseplan.com/api/documentation/
  baseURL: https://penncourseplan.com/api
