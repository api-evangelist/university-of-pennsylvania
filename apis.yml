aid: university-of-pennsylvania
name: University of Pennsylvania
description: 'The University of Pennsylvania (Penn) is a private Ivy League research university in Philadelphia.
  Penn operates no central developer portal and publishes no institution-wide API program, and the surface
  that the 2026-06-03 profile treated as its headline API — the Penn OpenData API on the ISC enterprise
  service bus — is retired: the host esb.isc-seo.upenn.edu no longer resolves and its documentation page
  returns a soft-404. What Penn genuinely operates is library and identity infrastructure: the PennKey
  Shibboleth identity provider, whose signed SAML 2.0 metadata resolves live in the InCommon federation;
  ScholarlyCommons at Penn, a DSpace 7.6 repository on Penn''s own domain serving a conformant OAI-PMH
  2.0 endpoint over real Penn records; the Franklin catalog and the Colenda digital repository, both Blacklight
  applications with JSON twins on every page under Penn Libraries'' published open-metadata policy; and
  OPenn, a bulk open-data site of manuscript images and TEI descriptions. The far larger and better known
  surface — Penn Course Alert, Penn Course Plan, Penn Course Review, Penn Degree Plan and Penn Clubs,
  with a live 45-path OpenAPI at penncourseplan.com/api/openapi/ — is NOT operated by the university.
  It is built and run by Penn Labs, a non-profit student-run software organization, on domains registered
  to Penn Labs. Penn''s Office of Student Affairs adopted Penn Clubs as its official student-group registry,
  which is institutional endorsement of the product, not institutional operation of the API. Those surfaces
  are recorded here as tenant relationships so the relationship is preserved without crediting Penn for
  engineering it did not do.'
