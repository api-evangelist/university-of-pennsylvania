    institution to tenant: the Penn Courses API and Penn Clubs API and their two SDKs are built and operated
    by Penn Labs, a non-profit student-run organization, on domains registered to Penn Labs — the university
    endorses Penn Clubs as its official student-group registry but does not operate any of it. Twenty-nine
    apis[] entries created by the per-tag OpenAPI split were collapsed into the ONE contract they describe.
    One surface was removed as retired: the Penn OpenData API on the ISC enterprise service bus, whose
    host no longer resolves and whose documentation page is a soft-404. No vendor-generic contract was
    saved. Penn operates no central developer portal, no open-data portal at data.upenn.edu, and no public
    API program; that absence is the finding, not a gap in the probe.'
