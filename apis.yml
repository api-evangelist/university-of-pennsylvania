  name: PennKey Identity Provider — SAML 2.0 / Shibboleth Metadata
  description: >-
    Penn's Shibboleth identity provider publishes a signed SAML 2.0 EntityDescriptor at a well-known location
    (HTTP 200, application/xml, entityID https://idp.pennkey.upenn.edu/idp/shibboleth), carrying the Shibboleth
